<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulary Week 01 – Sanatan Hindu Students IELTS Initiative</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Hind+Siliguri:wght@500;600&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{--bg:#f6f1fb;--bg2:#ffffff;--ink:#241a3a;--mute:#6b5f85;--gold:#c2410c;--rose:#be185d;--vio:#6d28d9;--card:#ffffffcc;--line:#2a1b5222;--glow:#c2410c33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0820;--bg2:#150e33;--ink:#f3ecff;--mute:#a79cc7;--gold:#ffb347;--rose:#ff5fa2;--vio:#9d7bff;--card:#1b1342cc;--line:#ffffff1c;--glow:#ffb34740}}
:root[data-theme="dark"]{--bg:#0c0820;--bg2:#150e33;--ink:#f3ecff;--mute:#a79cc7;--gold:#ffb347;--rose:#ff5fa2;--vio:#9d7bff;--card:#1b1342cc;--line:#ffffff1c;--glow:#ffb34740}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Poppins','Hind Siliguri',system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
.wm{position:fixed;left:0;right:0;bottom:8px;z-index:0;pointer-events:none;opacity:.5;text-align:center;font:500 11px Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--vio)}
main,header,footer{position:relative;z-index:1}
.hero{position:relative;min-height:78vh;display:grid;align-items:center;padding:7vh 6vw 5vh;overflow:hidden;
 background:radial-gradient(60% 70% at 80% 30%,var(--glow),transparent 70%),radial-gradient(50% 60% at 10% 90%,#9d7bff30,transparent 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;max-width:640px;pointer-events:none}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.brand img{width:58px;height:58px;border-radius:50%;background:#fff;padding:7px;box-shadow:0 8px 30px var(--glow)}
.brand span{font-weight:600;font-size:clamp(13px,3.4vw,16px);line-height:1.3;max-width:20ch}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(54px,15vw,128px);line-height:.95;letter-spacing:-.03em;
 background:linear-gradient(100deg,var(--gold),var(--rose) 55%,var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
.wk{display:inline-block;margin-top:18px;font-family:Fraunces,serif;font-weight:600;font-size:clamp(20px,5vw,28px);padding:6px 22px;border:1.5px solid var(--gold);border-radius:99px;color:var(--gold)}
.lead{margin-top:22px;color:var(--mute);font-size:15px;max-width:44ch;line-height:1.6}
.bar{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 5vw 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
 background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:4px}
button{font:inherit;cursor:pointer;color:var(--ink);background:none;border:0}
.tabs button{padding:8px 16px;border-radius:99px;font-size:13px;font-weight:500}
.tabs button[aria-pressed=true]{background:linear-gradient(100deg,var(--gold),var(--rose));color:#fff}
input{flex:1;min-width:150px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:10px 18px;outline:none}
input:focus,button:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
.act{border:1px solid var(--line);border-radius:99px;padding:9px 15px;font-size:13px;background:var(--bg2)}
.count{font-size:12px;color:var(--mute);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;padding:28px 5vw 60px;perspective:1400px}
.tilt{height:250px;transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer;border:0;text-align:left;display:block}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:20px;background:var(--card);
 border:1px solid var(--line);box-shadow:0 18px 40px -18px #0006,inset 0 1px 0 #ffffff22;overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(6px)}
.face::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--a)}
.front .w{font-family:Fraunces,serif;font-weight:800;font-size:30px;letter-spacing:-.01em;margin-top:auto;transform:translateZ(40px);word-break:break-word}
.front .pos{font-size:12px;color:var(--mute);font-style:italic;transform:translateZ(24px)}
.front .pr{font-family:'Hind Siliguri';font-size:16px;color:var(--a);font-weight:600}
.front .n{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;background:var(--a)}
.front .hint{font-size:11px;color:var(--mute);margin-top:10px}
.back{transform:rotateY(180deg);gap:7px;font-size:12.5px;overflow:auto}
.back .bn{font-family:'Hind Siliguri';font-weight:600;font-size:17px;color:var(--a);line-height:1.35}
.back .r{display:flex;gap:8px;align-items:baseline}
.tag{flex:none;font-size:10px;font-weight:600;color:#fff;border-radius:6px;padding:1px 7px;background:var(--a)}
.tag.ant{background:#e63946}.tag.ph{background:#6c757d}
.back .ex{margin-top:auto;font-style:italic;color:var(--mute);border-top:1px dashed var(--line);padding-top:9px;line-height:1.5}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.forms div{border:1px solid var(--a);border-radius:10px;text-align:center;padding:4px 2px;font-size:11px}
.forms i{display:block;font-style:normal;font-size:9px;color:var(--mute)}
.forms b{color:var(--a);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
footer{text-align:center;padding:22px 5vw calc(26px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.06em;color:var(--mute);border-top:1px solid var(--line)}
@media (hover:none){.tilt{transform:none!important}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.tilt{transition:none}}
</style></head>
